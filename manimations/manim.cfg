[CLI]
background_color = WHITE

# Kadr 16:9, 1280x720 (zmiana 2026-08-11 — było 840x360, czyli 21:9).
# Powód: na telefonie płaski kadr dawał filmowi 129 px wysokości przy
# ośmiokrotnym zapasie rozdzielczości — problemem był kształt, nie liczba
# pikseli. 1280 pokrywa telefon przy DPR 3 (900 px) i desktop przy DPR 2.
# Szczegóły i pomiary: docs/superpowers/specs/2026-08-11-rozwiazania-krok-po-kroku-design.md
pixel_width = 1280
pixel_height = 720

# 120 fps to ZAPAS POD SPOWOLNIENIE, nie płynność przy 1x. Spowolnienie nie
# dorysowuje klatek, tylko trzyma je dłużej: przy 60 fps tryb 0,25x wygląda
# jak 15 fps, a to właśnie ten tryb służy przyglądaniu się przekształceniu.
frame_rate = 120
